# Memoria del daemon de Gradle
org.gradle.jvmargs=-Xmx1024m

# NOTA (workaround de esta maquina): los sockets AF_UNIX estan bloqueados
# (antivirus/LSP de Winsock), lo que rompe Selector.open() en el JDK 21.
# Definir la variable de entorno JDK_JAVA_OPTIONS antes de compilar/ejecutar:
#   JDK_JAVA_OPTIONS=-Djdk.net.unixdomain.tmpdir=C:/__uds_disabled__
# (apuntar a una ruta inexistente fuerza al JDK a usar TCP loopback).
# No sirve ponerlo en org.gradle.jvmargs: Gradle filtra los -D personalizados
# y los aplica tarde. Fix definitivo: netsh winsock reset (admin + reinicio).
