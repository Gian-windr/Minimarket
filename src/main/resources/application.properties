spring.application.name=minimarket

# Base de datos (sobreescribir con variables de entorno en produccion)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/minimarket}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:cambiar-este-secreto-en-produccion-minimo-32-caracteres-hs256!!}
app.jwt.expiration-ms=86400000

# Datos del emisor para comprobantes
app.empresa.ruc=20000000001
app.empresa.razon-social=MiniMarket Don Manuelito S.A.C.
app.empresa.direccion=Av. Principal 123, Lima

# IGV (Peru)
app.igv=0.18

# Factiliza (validacion DNI/RUC)
app.factiliza.api-key=${API_KEY:}
app.factiliza.base-url=https://api.factiliza.com/v1

# Comprobantes: carpeta donde se guardan los PDF generados
app.comprobantes.ruta=${COMPROBANTES_DIR:./comprobantes}
