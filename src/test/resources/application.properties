# Configuracion exclusiva de pruebas: base en memoria, sin PostgreSQL
spring.datasource.url=jdbc:h2:mem:minimarket;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=secreto-solo-para-pruebas-con-longitud-suficiente-hs256
app.jwt.expiration-ms=3600000

app.empresa.ruc=20000000001
app.empresa.razon-social=MiniMarket Don Manuelito S.A.C.
app.empresa.direccion=Av. Principal 123, Lima

app.igv=0.18

app.factiliza.api-key=
app.factiliza.base-url=https://api.factiliza.com/v1

app.comprobantes.ruta=./build/tmp/comprobantes-test
